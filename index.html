<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>角色档案库</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        /* 背景与磨砂玻璃核心样式 */
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #f5f7fa 0%, #e8ecf1 100%);
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(180, 190, 255, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(200, 180, 255, 0.3) 0%, transparent 50%);
            z-index: -1;
        }

        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
        }

        /* 顶部导航栏 */
        header {
            max-width: 1200px;
            margin: 0 auto 30px;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        h1 {
            color: #4a4a6a;
            font-size: 28px;
            font-weight: 600;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: rgba(120, 110, 255, 0.8);
            color: white;
        }

        .btn-primary:hover {
            background: rgba(120, 110, 255, 1);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.6);
            color: #4a4a6a;
            border: 1px solid rgba(255, 255, 255, 0.9);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.9);
            transform: translateY(-2px);
        }

        .btn-danger {
            background: rgba(255, 100, 100, 0.8);
            color: white;
        }

        .btn-danger:hover {
            background: rgba(255, 100, 100, 1);
        }

        /* 角色卡片网格 */
        .character-grid {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
        }

        .character-card {
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .character-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.1);
        }

        .card-avatar {
            width: 100%;
            aspect-ratio: 3/4;
            border-radius: 12px;
            object-fit: cover;
            background: rgba(240, 240, 245, 0.8);
        }

        .card-name {
            font-size: 18px;
            font-weight: 600;
            color: #4a4a6a;
            text-align: center;
        }

        .empty-tip {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: #888;
            font-size: 16px;
        }

        /* 模态框通用样式 */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
            padding: 20px;
            overflow-y: auto;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            width: 100%;
            max-width: 800px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 30px;
            animation: modalShow 0.3s ease;
        }

        @keyframes modalShow {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 24px;
            font-weight: 600;
            color: #4a4a6a;
        }

        .close-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .close-btn:hover {
            background: rgba(255, 100, 100, 0.8);
            color: white;
        }

        /* 详情页样式 */
        .detail-avatar {
            width: 100%;
            max-height: 500px;
            object-fit: contain;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .detail-info {
            margin-bottom: 20px;
        }

        .detail-name {
            font-size: 28px;
            font-weight: 700;
            color: #4a4a6a;
            margin-bottom: 10px;
        }

        .detail-time {
            font-size: 14px;
            color: #888;
            margin-bottom: 20px;
        }

        .detail-profile {
            line-height: 1.8;
            color: #333;
            font-size: 16px;
            white-space: pre-wrap;
            padding: 20px;
            margin: 15px 0;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.5);
        }

        .detail-btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        /* 编辑表单样式 */
        .form-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 14px;
            font-weight: 500;
            color: #4a4a6a;
        }

        input[type="text"], textarea {
            padding: 12px 15px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.9);
            background: rgba(255, 255, 255, 0.6);
            font-size: 16px;
            color: #333;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus, textarea:focus {
            border-color: rgba(120, 110, 255, 0.8);
            background: rgba(255, 255, 255, 0.9);
        }

        textarea {
            min-height: 300px;
            resize: vertical;
            line-height: 1.6;
        }

        .avatar-preview {
            width: 100%;
            max-height: 300px;
            object-fit: contain;
            border-radius: 12px;
            background: rgba(240, 240, 245, 0.8);
            margin-top: 10px;
        }

        input[type="file"] {
            padding: 10px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.6);
            cursor: pointer;
        }

        .form-btn-group {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        /* 底部提示 */
        footer {
            max-width: 1200px;
            margin: 40px auto 0;
            text-align: center;
            color: #888;
            font-size: 14px;
            padding: 20px;
        }

        /* 提示框 */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            z-index: 9999;
            opacity: 0;
            transition: all 0.3s ease;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* 响应式适配 */
        @media (max-width: 768px) {
            h1 {
                font-size: 22px;
            }
            header {
                padding: 15px 20px;
            }
            .character-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 15px;
            }
            .modal-content {
                padding: 20px;
            }
            .detail-name {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <!-- 顶部导航 -->
    <header class="glass">
        <h1>角色档案库</h1>
        <div class="btn-group">
            <button class="btn-secondary" id="importBtn">导入备份</button>
            <button class="btn-secondary" id="exportBtn">导出全部</button>
            <button class="btn-primary" id="addBtn">新增角色</button>
        </div>
    </header>

    <!-- 角色卡片列表 -->
    <main class="character-grid" id="characterGrid">
        <div class="empty-tip glass">
            还没有角色档案，点击「新增角色」创建你的第一个档案吧～
        </div>
    </main>

    <!-- 底部提示 -->
    <footer>
        数据自动保存在浏览器本地，建议定期导出备份，防止清理缓存丢失
    </footer>

    <!-- 详情模态框 -->
    <div class="modal" id="detailModal">
        <div class="modal-content glass">
            <div class="modal-header">
                <h2 class="modal-title" id="detailModalTitle">角色详情</h2>
                <div class="close-btn" id="detailCloseBtn">×</div>
            </div>
            <img id="detailAvatar" class="detail-avatar" src="" alt="角色形象">
            <div class="detail-info">
                <h3 class="detail-name" id="detailName"></h3>
                <div class="detail-time" id="detailTime"></div>
                <div class="detail-profile" id="detailProfile"></div>
            </div>
            <div class="detail-btn-group">
                <button class="btn-secondary" id="copyBtn">一键复制档案</button>
                <button class="btn-primary" id="editFromDetailBtn">编辑档案</button>
                <button class="btn-danger" id="deleteBtn">删除档案</button>
            </div>
        </div>
    </div>

    <!-- 编辑/新增模态框 -->
    <div class="modal" id="editModal">
        <div class="modal-content glass">
            <div class="modal-header">
                <h2 class="modal-title" id="editModalTitle">新增角色</h2>
                <div class="close-btn" id="editCloseBtn">×</div>
            </div>
            <form id="editForm">
                <input type="hidden" id="editCharacterId">
                <div class="form-group">
                    <label for="editName">角色名称</label>
                    <input type="text" id="editName" placeholder="请输入角色名称" required>
                </div>
                <div class="form-group">
                    <label for="editAvatar">角色形象图</label>
                    <input type="file" id="editAvatar" accept="image/*">
                    <img id="avatarPreview" class="avatar-preview" src="" alt="预览图">
                </div>
                <div class="form-group">
                    <label for="editProfile">角色设定</label>
                    <textarea id="editProfile" placeholder="请输入角色的详细设定、背景、性格、故事等内容..." required></textarea>
                </div>
                <div class="form-btn-group">
                    <button type="button" class="btn-secondary" id="editCancelBtn">取消</button>
                    <button type="submit" class="btn-primary">保存档案</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 导入文件输入框 -->
    <input type="file" id="importFileInput" accept=".json" style="display: none;">

    <!-- 提示框 -->
    <div class="toast" id="toast"></div>

    <script>
        // 全局数据
        let characterList = [];
        const STORAGE_KEY = "characterArchiveData";
        let currentDetailId = null;

        // 初始化
        window.onload = () => {
            loadData();
            renderList();
            bindEvents();
        };

        // 从本地存储加载数据
        function loadData() {
            const data = localStorage.getItem(STORAGE_KEY);
            if (data) {
                try {
                    characterList = JSON.parse(data);
                } catch (e) {
                    characterList = [];
                    showToast("数据加载失败，已重置");
                }
            }
        }

        // 保存数据到本地存储
        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(characterList));
        }

        // 渲染角色列表
        function renderList() {
            const grid = document.getElementById("characterGrid");
            if (characterList.length === 0) {
                grid.innerHTML = `
                    <div class="empty-tip glass">
                        还没有角色档案，点击「新增角色」创建你的第一个档案吧～
                    </div>
                `;
                return;
            }

            grid.innerHTML = characterList.map(character => `
                <div class="character-card glass" data-id="${character.id}">
                    <img class="card-avatar" src="${character.avatar || 'data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 3 4\'%3E%3Crect fill=\'%23f0f0f5\' width=\'3\' height=\'4\'/%3E%3C/svg%3E'}" alt="${character.name}">
                    <div class="card-name">${character.name}</div>
                </div>
            `).join("");

            // 绑定卡片点击事件
            document.querySelectorAll(".character-card").forEach(card => {
                card.addEventListener("click", () => {
                    const id = card.dataset.id;
                    openDetailModal(id);
                });
            });
        }

        // 打开详情模态框
        function openDetailModal(id) {
            const character = characterList.find(item => item.id === id);
            if (!character) return;

            currentDetailId = id;
            document.getElementById("detailModalTitle").textContent = `${character.name} 的档案`;
            document.getElementById("detailAvatar").src = character.avatar || 'data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 3 4\'%3E%3Crect fill=\'%23f0f0f5\' width=\'3\' height=\'4\'/%3E%3C/svg%3E';
            document.getElementById("detailName").textContent = character.name;
            document.getElementById("detailTime").textContent = `创建时间：${new Date(character.createTime).toLocaleString()}`;
            document.getElementById("detailProfile").textContent = character.profile;

            document.getElementById("detailModal").classList.add("active");
        }

        // 打开编辑模态框
        function openEditModal(id = null) {
            const modal = document.getElementById("editModal");
            const form = document.getElementById("editForm");
            const modalTitle = document.getElementById("editModalTitle");

            // 重置表单
            form.reset();
            document.getElementById("avatarPreview").src = "";
            document.getElementById("editCharacterId").value = "";

            if (id) {
                // 编辑模式
                const character = characterList.find(item => item.id === id);
                if (!character) return;

                modalTitle.textContent = `编辑 ${character.name} 的档案`;
                document.getElementById("editCharacterId").value = character.id;
                document.getElementById("editName").value = character.name;
                document.getElementById("editProfile").value = character.profile;
                if (character.avatar) {
                    document.getElementById("avatarPreview").src = character.avatar;
                }
            } else {
                // 新增模式
                modalTitle.textContent = "新增角色";
            }

            modal.classList.add("active");
        }

        // 绑定所有事件
        function bindEvents() {
            // 新增按钮
            document.getElementById("addBtn").addEventListener("click", () => {
                openEditModal();
            });

            // 详情页关闭按钮
            document.getElementById("detailCloseBtn").addEventListener("click", () => {
                document.getElementById("detailModal").classList.remove("active");
                currentDetailId = null;
            });

            // 编辑页关闭按钮
            document.getElementById("editCloseBtn").addEventListener("click", () => {
                document.getElementById("editModal").classList.remove("active");
            });
            document.getElementById("editCancelBtn").addEventListener("click", () => {
                document.getElementById("editModal").classList.remove("active");
            });

            // 点击模态框空白处关闭
            document.querySelectorAll(".modal").forEach(modal => {
                modal.addEventListener("click", (e) => {
                    if (e.target === modal) {
                        modal.classList.remove("active");
                        if (modal.id === "detailModal") currentDetailId = null;
                    }
                });
            });

            // 图片上传预览
            document.getElementById("editAvatar").addEventListener("change", (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    document.getElementById("avatarPreview").src = event.target.result;
                };
                reader.readAsDataURL(file);
            });

            // 表单提交
            document.getElementById("editForm").addEventListener("submit", (e) => {
                e.preventDefault();

                const id = document.getElementById("editCharacterId").value;
                const name = document.getElementById("editName").value.trim();
                const profile = document.getElementById("editProfile").value.trim();
                const avatar = document.getElementById("avatarPreview").src;

                if (!name || !profile) {
                    showToast("请填写角色名称和设定");
                    return;
                }

                if (id) {
                    // 编辑
                    const index = characterList.findIndex(item => item.id === id);
                    if (index !== -1) {
                        characterList[index] = {
                            ...characterList[index],
                            name,
                            profile,
                            avatar: avatar || characterList[index].avatar
                        };
                        showToast("档案修改成功");
                    }
                } else {
                    // 新增
                    const newCharacter = {
                        id: Date.now().toString(),
                        name,
                        profile,
                        avatar,
                        createTime: Date.now()
                    };
                    characterList.unshift(newCharacter);
                    showToast("新角色档案创建成功");
                }

                saveData();
                renderList();
                document.getElementById("editModal").classList.remove("active");
            });

            // 详情页编辑按钮
            document.getElementById("editFromDetailBtn").addEventListener("click", () => {
                if (!currentDetailId) return;
                document.getElementById("detailModal").classList.remove("active");
                openEditModal(currentDetailId);
            });

            // 一键复制按钮
            document.getElementById("copyBtn").addEventListener("click", () => {
                const character = characterList.find(item => item.id === currentDetailId);
                if (!character) return;

                const copyText = `角色名称：${character.name}\n\n角色设定：\n${character.profile}`;
                navigator.clipboard.writeText(copyText).then(() => {
                    showToast("档案内容已复制到剪贴板");
                }).catch(() => {
                    // 兼容不支持clipboard的情况
                    const textarea = document.createElement("textarea");
                    textarea.value = copyText;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand("copy");
                    document.body.removeChild(textarea);
                    showToast("档案内容已复制到剪贴板");
                });
            });

            // 删除按钮
            document.getElementById("deleteBtn").addEventListener("click", () => {
                if (!currentDetailId) return;
                const character = characterList.find(item => item.id === currentDetailId);
                if (!confirm(`确定要删除「${character.name}」的档案吗？删除后无法恢复！`)) {
                    return;
                }

                characterList = characterList.filter(item => item.id !== currentDetailId);
                saveData();
                renderList();
                document.getElementById("detailModal").classList.remove("active");
                currentDetailId = null;
                showToast("档案已删除");
            });

            // 导出全部按钮
            document.getElementById("exportBtn").addEventListener("click", () => {
                if (characterList.length === 0) {
                    showToast("暂无档案可导出");
                    return;
                }

                const dataStr = JSON.stringify(characterList, null, 2);
                const blob = new Blob([dataStr], { type: "application/json" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = `角色档案备份_${new Date().toLocaleDateString().replace(/\//g, "-")}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast("全部档案已导出，请保存好备份文件");
            });

            // 导入按钮
            document.getElementById("importBtn").addEventListener("click", () => {
                document.getElementById("importFileInput").click();
            });

            // 导入文件选择
            document.getElementById("importFileInput").addEventListener("change", (e) => {
                const file = e.target.files[0];
                if (!file) return;

                if (!file.name.endsWith(".json")) {
                    showToast("请选择正确的.json备份文件");
                    return;
                }

                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const data = JSON.parse(event.target.result);
                        if (!Array.isArray(data)) {
                            showToast("备份文件格式错误");
                            return;
                        }
                        // 确认导入
                        if (confirm(`确定要导入吗？将覆盖当前所有档案，共${data.length}条`)) {
                            characterList = data;
                            saveData();
                            renderList();
                            showToast("档案导入成功");
                        }
                    } catch (err) {
                        showToast("文件解析失败，请检查备份文件是否完整");
                    }
                };
                reader.readAsText(file);
                // 重置input，允许重复选择同一个文件
                e.target.value = "";
            });
        }

        // 提示框
        function showToast(message) {
            const toast = document.getElementById("toast");
            toast.textContent = message;
            toast.classList.add("show");

            setTimeout(() => {
                toast.classList.remove("show");
            }, 2500);
        }
    </script>
</body>
</html>
